      .tp-baseline {

        height: 2px;
        overflow: visible;
      }
      .tp-baseline line {
        fill: none;
        stroke: rgba(26, 24, 21, 0.2);

      /* bar columns — review fix (render v2): wider bars + gaps so the chart spans the frame
         -> 340px columns at x = 118 / 568 / 1018; the Opus footnote sits beside the read bar.
         Bars sit on the baseline (bottom 188px). */
      .tp-bar {
        position: absolute;
        bottom: 188px;
        width: 340px;
        transform-origin: 50% 100%;
      }
      /* heights exactly proportional to 1 : 1.25 : 0.1 (unit 307.2px = sketch 16cqw) */
      .tp-bar-1 { left: 118px; height: 307.2px; background: #1A1815; }
      .tp-bar-2 { left: 568px; height: 384px;   background: rgba(26, 24, 21, 0.5); }
      .tp-bar-3 { left: 1018px; height: 30.72px; background: #C15F3C; }

      /* figure lockups: Playfair figure 5.4cqw = 104px + mono unit 2.4cqw = 46px,
         sitting 1cqw = 19px above the bar top */
      .tp-fig {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        opacity: 0;
      }
      .tp-fig-1 { left: 118px; bottom: 514.2px; }
      .tp-fig-2 { left: 568px; bottom: 591px; }
      .tp-fig-3 { left: 1018px; bottom: 237.72px; color: #C15F3C; }

      .tp-num {
        display: inline-block;
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 400;
        font-size: 104px;
        line-height: 1;
        letter-spacing: -0.025em;

      .tp-unit {
        display: inline-block;
        font-family: "JetBrains Mono", monospace;

        font-size: 46px;

        opacity: 0;
      }

      /* column labels: bottom edge of the pad (y 952-1000) */
      .tp-label {
        position: absolute;
        top: 952px;
        width: 340px;
        opacity: 0;
      }
      .tp-label-1 { left: 118px; }
      .tp-label-2 { left: 568px; }
      .tp-label-3 { left: 1018px; }

      /* footnote: beside the 0.1x read bar, resting on the baseline (two lines) */
      .tp-foot {
        position: absolute;
        left: 1400px;
        bottom: 188px;
        display: flex;
        align-items: flex-end;
        gap: 22px;
      }
      .tp-foot-bar {
        width: 64px;
        height: 15.36px; /* 0.05 on the same 307.2px unit */
        background: #C15F3C;
        transform-origin: 50% 100%;
      }
      .tp-foot-text {
        padding-bottom: 0;
        line-height: 1.25;
        opacity: 0;
      }
      .tp-foot-val {
        display: inline-block;
        font-variant-numeric: tabular-nums;
        opacity: 0;
      }
    </style>

    <div data-hf-id="hf-pxpw" class="tp-bg clip" id="08-the-price-bg" data-start="0" data-duration="11.82" data-track-index="0"></div>

    <div data-hf-id="hf-chx1" class="tp-stage">
      <div data-hf-id="hf-ko47" class="tp-kicker" id="08-the-price-kicker"><span data-hf-id="hf-schk" class="tp-spike" id="08-the-price-spike">✱</span> Price per input token</div>

      <svg data-hf-id="hf-3ff4" class="tp-baseline" viewBox="0 0 1760 2" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">

      </svg>

      <div data-hf-id="hf-n5sv" class="tp-bar tp-bar-1" id="08-the-price-bar1"></div>
      <div data-hf-id="hf-4cxl" class="tp-bar tp-bar-2" id="08-the-price-bar2"></div>
      <div data-hf-id="hf-t1nn" class="tp-bar tp-bar-3" id="08-the-price-bar3"></div>

      <div data-hf-id="hf-b4eu" class="tp-fig tp-fig-1" id="08-the-price-fig1"><span data-hf-id="hf-2s7e" class="tp-num" id="08-the-price-num1">0</span><span data-hf-id="hf-nsg1" class="tp-unit" id="08-the-price-unit1">×</span></div>
      <div data-hf-id="hf-99cw" class="tp-fig tp-fig-2" id="08-the-price-fig2"><span data-hf-id="hf-51qb" class="tp-num" id="08-the-price-num2">0.00</span><span data-hf-id="hf-bae8" class="tp-unit" id="08-the-price-unit2">×</span></div>
      <div data-hf-id="hf-rxd2" class="tp-fig tp-fig-3" id="08-the-price-fig3"><span data-hf-id="hf-3oz6" class="tp-num" id="08-the-price-num3">0.0</span><span data-hf-id="hf-9rib" class="tp-unit" id="08-the-price-unit3">×</span></div>

        <div data-hf-id="hf-tv9l" class="tp-mono tp-foot-text" id="08-the-price-foottext">Opus 5.5 read<br><span data-hf-id="hf-hav3" class="tp-foot-val" id="08-the-price-footval"><span data-hf-id="hf-to8d" id="08-the-price-footnum">0.00</span>×</span></div>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "08-the-price";
        var DURATION = 11.32;
        var root = document.querySelector('[data-composition-id="' + ID + '"]');
        // ids start with a digit, so look them up by attribute
        var byId = function (id) { return root.querySelector('[id="' + ID + "-" + id + '"]'); };

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0–2.8s): kicker, baseline draw, column labels ------
        tl.fromTo(byId("kicker"),
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          0.64);                                                    // "price."
        tl.fromTo(byId("spike"),
          { scale: 0.92 },
          { scale: 1, duration: 0.5, ease: "power2.out" },
          0.64);

        // svg-path-draw: measured dash, offset -> 0, left to right
        var base = byId("baseline");
        var BASE_LEN = base.getTotalLength();
        tl.fromTo(base,
          { strokeDasharray: BASE_LEN, strokeDashoffset: BASE_LEN },
          { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" },
          0.9);

        ["label1", "label2", "label3"].forEach(function (id, i) {
          tl.fromTo(byId(id),
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
            1.6 + i * 0.18);
        });

        // ---- stat-bars-and-fills + counting-dynamic-scale ------------------
        // bar grows (scaleY from the baseline), the figure rides up with the
        // bar top and counts up on the same ease + duration; the mono unit
        // arrives after the count lands.
        function statBeat(n, target, decimals, barH, at, dur) {
          var bar = byId("bar" + n);
          var fig = byId("fig" + n);
          var num = byId("num" + n);
          var unit = byId("unit" + n);
          var state = { v: 0 };
          var EASE = "power3.out";

          tl.fromTo(bar, { scaleY: 0 }, { scaleY: 1, duration: dur, ease: EASE }, at);
          tl.fromTo(fig, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, at);
          tl.fromTo(fig, { y: barH }, { y: 0, duration: dur, ease: EASE }, at);
          tl.fromTo(num, { scale: 0.5 }, { scale: 1, duration: dur, ease: EASE }, at);
          tl.fromTo(state,
            { v: 0 },
            {
              v: target, duration: dur, ease: EASE,
              onUpdate: function () { num.textContent = state.v.toFixed(decimals); }
            },
            at);
          tl.fromTo(unit,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
            at + dur);
        }

        // Unit for bar heights: 307.2px = 1×
        // ---- Scene 2 (2.8–6.3s) --------------------------------------------
        statBeat(1, 1, 0, 307.2, 2.88, 1.3);    // "one times."
        statBeat(2, 1.25, 2, 384, 5.2, 1.3);    // "one and a quarter"

        // ---- Scene 3 (6.3–8.3s) --------------------------------------------
        statBeat(3, 0.1, 1, 30.72, 7.2, 1.0);   // "one tenth."

        // ---- Scene 4 (8.3–11.32s): footnote --------------------------------
        tl.fromTo(byId("foottext"),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          8.56);                                                    // "Opus"
        tl.fromTo(byId("footbar"),
          { scaleY: 0 },
          { scaleY: 1, duration: 0.6, ease: "power3.out" },
          8.7);

        var footNum = byId("footnum");
        var footState = { v: 0 };
        tl.fromTo(byId("footval"),
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out" },
          9.3);
        tl.fromTo(footState,
          { v: 0 },
          {
            v: 0.05, duration: 1.1, ease: "power3.out",
            onUpdate: function () { footNum.textContent = footState.v.toFixed(2); }
          },
          9.3);                                                     // lands on "twentieth." 10.4

        // hold to the end of the frame
        tl.set({}, {}, DURATION);

        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
