    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "07-prefix-rule";
        var DURATION = 10.2;
        var root = document.querySelector('[data-composition-id="' + ID + '"]');
        var q = function (sel) { return root.querySelector(sel); };
        // ids start with a digit, so look them up by attribute
        var byId = function (id) { return root.querySelector('[id="' + ID + "-" + id + '"]'); };

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // ---- initial hidden states (seek-safe, set at t=0) ------------------
        ["sys", "ctx", "conv"].forEach(function (k) {
          tl.set(byId("fill-" + k), { scaleY: 0 }, 0);
          tl.set(byId("wave-" + k), { yPercent: -101 }, 0);
        });

        // ---- Scene 1 (0.0–3.5s): headline per word + stack assembles --------
        var WORDS = [
          { idx: 0, start: 0.30 }, // "It"
          { idx: 1, start: 0.52 }, // "match"
          { idx: 2, start: 2.20 }, // "starts"
          { idx: 3, start: 2.46 }, // "at the"
          { idx: 4, start: 2.76 }  // "top."
        ];
        WORDS.forEach(function (w) {
          tl.fromTo(q('[data-pr07-word="' + w.idx + '"]'),
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            w.start);
        });

        // grid-card-assemble: short slide straight into slot, top-down stagger
        ["sys", "ctx", "conv"].forEach(function (k, i) {
          tl.fromTo(byId("card-" + k),
            { opacity: 0, y: 36 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            2.2 + i * 0.18);
        });

        // ---- helpers ---------------------------------------------------------
        // turn a layer clay: outline in, tint floods down from the top edge
        function cook(k, at, dur) {
          tl.fromTo(byId("edge-" + k), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, at);
          tl.fromTo(byId("fill-" + k), { scaleY: 0 }, { scaleY: 1, duration: dur, ease: "power2.inOut" }, at);
        }
        // a clay wash front sweeping down through a layer (the flood)
        function wave(k, at, dur) {
          tl.fromTo(byId("wave-" + k), { yPercent: -101 }, { yPercent: 101, duration: dur, ease: "power1.inOut" }, at);
        }
        // first appearance of a tag
        function showTag(id, at) {
          tl.fromTo(byId(id), { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, at);
        }
        // discrete-text-sequence: whole-state hard swap at the threshold
        function swapTag(fromId, toId, at) {
          tl.set(byId(fromId), { opacity: 0 }, at);
          tl.set(byId(toId), { opacity: 1, x: 0 }, at);
        }

        // ---- Scene 2 (3.5–6.4s): only Conversation re-cooks ------------------
        cook("conv", 4.04, 0.55);                 // "conversation,"
        showTag("tag-conv-reread", 4.04);
        showTag("tag-sys-cached", 5.16);          // "prep stays."
        showTag("tag-ctx-cached", 5.24);

        // ---- Scene 3 (6.4–10.2s): a change on top floods down ---------------
        cook("sys", 7.08, 0.5);                   // "above"
        swapTag("tag-sys-cached", "tag-sys-changed", 7.08);
        wave("sys", 7.08, 0.8);

        cook("ctx", 8.04, 0.5);                   // "everything below"
        swapTag("tag-ctx-cached", "tag-ctx-reread", 8.04);
        wave("ctx", 8.04, 0.8);

        wave("conv", 8.6, 1.08);                  // flood reaches the bottom, lands on "again."

        // hold the landed state (the sketch) to the end of the frame
        tl.set({}, {}, DURATION);

        window.__timelines[ID] = tl;
      })();
    </script>
