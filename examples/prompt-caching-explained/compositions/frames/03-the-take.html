    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "03-the-take";
        var DURATION = 6.76;
        var root = document.querySelector('[data-composition-id="' + ID + '"]');
        // ids start with a digit, so look them up by attribute
        var byId = function (id) { return root.querySelector('[id="' + id + '"]'); };

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        var kicker = byId("03-the-take-kicker");
        var quote = byId("03-the-take-quote");
        var prep = byId("03-the-take-prep");
        var rule = byId("03-the-take-rule");

        // ---- Scene 1 (0.0–3.1s): kicker fades up on "So" (0.08s) ----------
        tl.fromTo(kicker,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          0.08);

        // svg-path-draw: the hairline rule draws left-to-right, done by "re-read." (1.92s)
        var len = rule.getTotalLength();
        tl.fromTo(rule,
          { strokeDasharray: len, strokeDashoffset: len },
          { strokeDasharray: len, strokeDashoffset: 0, duration: 1.4, ease: "power2.out" },
          0.5);

        // ---- Review fix (render v2): the line the voice is saying fills the slot until the quote.
        // "You pay for the re-read." per word on the spoken cues (transcript.json):
        // "you" 0.80 · "pay" 0.96 · "for" 1.20 · "the" 1.80 · "re-read." 1.92
        var pre = byId("03-the-take-pre");
        var preWords = pre.querySelectorAll(".take-pre-word");
        var preTimes = [0.8, 0.96, 1.2, 1.8, 1.92];
        for (var i = 0; i < preWords.length; i++) {
          tl.fromTo(preWords[i],
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            preTimes[i]);
        }
        // scale-swap seam: the pre-line shrinks + fades out as the quote rises in on "Prompt"
        tl.fromTo(pre,
          { opacity: 1, scale: 1 },
          { opacity: 0, scale: 0.96, duration: 0.35, ease: "power2.in" },
          2.92);

        // ---- Scene 2 (3.1–5.1s): the one restrained move — quote slides up + crossfades in on "Prompt" (3.12s)
        tl.fromTo(quote,
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
          3.12);

        // ---- Scene 3 (5.1–6.76s): "prep" warms ink -> clay on its word (5.08s), colour only
        tl.fromTo(prep,
          { color: "#1A1815" },
          { color: "#C15F3C", duration: 0.5, ease: "power1.out" },
          5.08);

        // held frame, completely still, to the end
        tl.set({}, {}, DURATION);

        window.__timelines[ID] = tl;
      })();
    </script>
