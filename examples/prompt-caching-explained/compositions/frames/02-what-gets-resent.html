        overflow: hidden;

        position: absolute;

      .wgr-stage {
        position: absolute;

      }

      /* 80px pad on every side (4.2cqw sketch pad) */
      .wgr-pad {
        position: absolute;
        left: 80px;
        top: 80px;
        right: 80px;
        bottom: 80px;

      /* headline: sketch 4.4cqw = 84px, Playfair 400, sentence case */
      .wgr-headline {
        position: absolute;
        left: 0;
        top: 0;

        font-weight: 400;
        font-size: 84px;
        line-height: 1.06;
        letter-spacing: -0.018em;

      .wgr-word {
        display: inline-block;
        opacity: 0;
      }
      .wgr-clay {

        font-style: italic;

      /* rows: sketch top 11cqw = 211px, label col 9cqw = 173px, gaps 1.8cqw/1.6cqw = 35/31px */
      .wgr-rows {
        position: absolute;
        left: 0;
        right: 0;
        top: 211px;
        display: grid;
        grid-template-columns: 173px 1fr;
        column-gap: 31px;
        row-gap: 35px;
        align-items: center;
        transform-origin: 0% 50%;

      .wgr-mono {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 40px;
        letter-spacing: 0.02em;
        line-height: 1.2;
        white-space: nowrap;
      }

      .wgr-turn {
        opacity: 0;
      }

      /* bars: 3.6cqw = 69px tall; width of 1fr (1556px) -> 46% / 66% / 90% */
      .wgr-req {
        display: flex;
        height: 69px;
        border-radius: 8px;
        overflow: hidden;
      }
      .wgr-req-1 { width: 716px; }
      .wgr-req-2 { width: 1027px; }
      .wgr-req-3 { width: 1400px; }

      .wgr-seg {
        display: block;
        height: 100%;
        transform-origin: 0% 50%;

      .wgr-s1 { background: #1A1815; }
      .wgr-s2 { background: rgba(26, 24, 21, 0.72); }
      .wgr-s3 { background: rgba(26, 24, 21, 0.48); }
      .wgr-s4 { background: rgba(26, 24, 21, 0.28); }
      .wgr-s5 { background: #C15F3C; }

      /* legend along the bottom, wraps (sketch gap 1cqw / 2.4cqw = 19 / 46px) */
      .wgr-legend {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 19px 46px;
      }
      .wgr-chip {
        opacity: 0;
      }
      .wgr-chip-clay {
        color: #C15F3C;
      }
    </style>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "02-what-gets-resent";
        var DURATION = 12.36;
        var root = document.querySelector('[data-composition-id="' + ID + '"]');
        var q = function (sel) { return root.querySelector(sel); };
        var qa = function (sel) { return root.querySelectorAll(sel); };
        // ids start with a digit, so look them up by attribute (a bare #02-… selector is invalid)
        var byId = function (id) { return root.querySelector('[id="' + id + '"]'); };

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // ---- helpers ------------------------------------------------------
        // stat-bars-and-fills: progress fill via scaleX from a left origin (never width)
        function growSeg(target, at, dur, ease) {
          tl.fromTo(target,
            { scaleX: 0 },
            { scaleX: 1, duration: dur, ease: ease || "power3.out" },
            at);
        }
        function revealChip(target, at) {
          tl.fromTo(target,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
            at);
        }
        function revealLabel(target, at) {
          tl.fromTo(target,
            { opacity: 0, x: -18 },
            { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
            at);
        }


        // ---- Scene 1 (0.0–2.8s): turn 1 + system prompt, then CLAUDE.md -----
        revealLabel(byId("02-what-gets-resent-turn1"), 0.1);
        revealChip(byId("02-what-gets-resent-chip1"), 0.2);
        growSeg(byId("02-what-gets-resent-t1s1"), 0.2, 0.7);         // "system"

        growSeg(byId("02-what-gets-resent-t1s2"), 1.48, 0.6);        // "Claude"
        revealChip(byId("02-what-gets-resent-chip2"), 1.48);

        // ---- Scene 2 (2.8–5.6s): messages, then the tool-results chip -------
        growSeg(byId("02-what-gets-resent-t1s3"), 3.16, 0.7);        // "message,"
        revealChip(byId("02-what-gets-resent-chip3"), 3.16);
        revealChip(byId("02-what-gets-resent-chip4"), 4.28);         // "tool" (no segment in turn 1)

        // ---- Scene 3 (5.6–8.3s): the clay new line snaps on, rows 2 + 3 assemble
        growSeg(byId("02-what-gets-resent-t1s5"), 6.28, 0.28, "power4.out"); // "new"
        revealChip(byId("02-what-gets-resent-chip5"), 6.28);

        // grid-card-assemble: staggered self-assembly, one row per beat
        revealLabel(byId("02-what-gets-resent-turn2"), 6.96);         // "tacked"
        tl.fromTo(qa(".wgr-row2"),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.42, ease: "power3.out", stagger: 0.07 },
          6.96);

        revealLabel(byId("02-what-gets-resent-turn3"), 7.48);         // "end."
        tl.fromTo(qa(".wgr-row3"),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.42, ease: "power3.out", stagger: 0.07 },
          7.48);

        // ---- Scene 4 (8.3–12.36s): headline per word -----------------------
        // dynamic-content-sequencing: pre-compute the word schedule once, then
        // lay every reveal on the timeline from that flat table.
        var WORDS = [
          { idx: 0, start: 8.36 },  // "Most"
          { idx: 1, start: 8.68 },  // "of"
          { idx: 2, start: 8.92 },  // on "every"
          { idx: 3, start: 10.44 }, // "Claude"
          { idx: 4, start: 11.24 }, // "already"
          { idx: 5, start: 11.64 }  // "read."
        ];
        var SCHEDULE = WORDS.map(function (w) {
          return { el: q('[data-wgr-word="' + w.idx + '"]'), start: w.start };
        });
        SCHEDULE.forEach(function (entry) {
          tl.fromTo(entry.el,
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            entry.start);
        });

        // hold to the end of the frame
        tl.set({}, {}, DURATION);

        window.__timelines[ID] = tl;
      })();
    </script>

</template>
