<template id="04-empty-kitchen-template">
  <div data-hf-id="hf-eejj" id="root" data-composition-id="04-empty-kitchen" data-width="1920" data-height="1080" data-start="0" data-duration="10.42">
    <style>
      @font-face { font-family: "Playfair Display"; src: url("assets/fonts/playfair-display-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Playfair Display"; src: url("assets/fonts/playfair-display-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        color: #1A1815;
      }

      /* full-bleed cream ground + plate (background clip layer) */
      .ek-bg {
        position: absolute;
        inset: 0;
        background: #F4F1EA;
        overflow: hidden;
      }
      /* the push-in runs on this wrapper, never on the clip element */
      .ek-plate-wrap {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .ek-plate {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        mix-blend-mode: multiply;
        display: block;
      }
      /* ink underline beneath the ticket rail (rides with the plate) */
      .ek-underline {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: visible;
      }
      .ek-underline line {
        stroke: #1A1815;
        stroke-width: 3;
        stroke-linecap: round;
        fill: none;
      }

      .ek-stage {
        position: absolute;
        inset: 0;
      }

      /* sketch: .pad inset 4.2cqw (80px), right:66% -> column x 80..653px, centered vertically */
      .ek-pad {
        position: absolute;
        left: 80px;
        top: 80px;
        bottom: 80px;
        width: 573px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      /* kicker: sketch 2.1cqw = 40px, JetBrains Mono 500 uppercase 0.16em, coral spike */
      .ek-kicker {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 40px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        line-height: 1.2;
        white-space: nowrap;
        opacity: 0;
      }
      .ek-spike {
        color: #C15F3C;
      }

      /* headline: sketch 4.8cqw = 92px, margin-top 2.4cqw = 46px */
      .ek-headline {
        margin-top: 46px;
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 400;
        font-size: 92px;
        line-height: 1.06;
        letter-spacing: -0.018em;
      }
      .ek-word {
        display: inline-block;
        opacity: 0;
      }
      .ek-clay {
        color: #C15F3C;
        font-style: italic;
      }

    <div data-hf-id="hf-e4fa" class="ek-bg clip" id="04-empty-kitchen-bg" data-start="0" data-duration="10.42" data-track-index="0">

          <line data-hf-id="hf-1h3h" id="04-empty-kitchen-ul2" x1="1000" y1="442" x2="1360" y2="463" />

    <div data-hf-id="hf-y4fd" class="ek-stage clip" id="04-empty-kitchen-stage" data-start="0" data-duration="10.42" data-track-index="1">
      <div data-hf-id="hf-xbe4" class="ek-pad">
        <div data-hf-id="hf-u44a" class="ek-kicker" id="04-empty-kitchen-kicker"><span data-hf-id="hf-m52z" class="ek-spike">✱</span> No cache</div>
        <div data-hf-id="hf-4o7t" class="ek-headline">
          <span data-hf-id="hf-57c0" class="ek-word" data-ek-word="0">Every</span>
          <span data-hf-id="hf-yzio" class="ek-word" data-ek-word="1">order</span>
          <span data-hf-id="hf-60o6" class="ek-word" data-ek-word="2">starts</span>
          <span data-hf-id="hf-rxzw" class="ek-word ek-clay" data-ek-word="3">cold.</span>
        </div>
      </div>
    </div>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "04-empty-kitchen";
        var DURATION = 9.92;
        var root = document.querySelector('[data-composition-id="' + ID + '"]');
        var q = function (sel) { return root.querySelector(sel); };
        // ids start with a digit, so look them up by attribute
        var byId = function (id) { return root.querySelector('[id="' + id + '"]'); };

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0–2.3s): plate fades up from cream; the one camera move
        tl.fromTo(byId("04-empty-kitchen-plate"),
          { opacity: 0 },
          { opacity: 1, duration: 1.0, ease: "power1.out" },
          0);
        // slow constant push-in, linear, whole frame (1.00 -> 1.04)
        tl.fromTo(byId("04-empty-kitchen-platewrap"),
          { scale: 1 },
          { scale: 1.04, duration: DURATION, ease: "none" },
          0);
        // kicker on "cache," (0.64s)
        tl.fromTo(byId("04-empty-kitchen-kicker"),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
          0.64);

        // ---- Scene 2 (2.3–5.2s): headline per word on the voice ------------
        var WORDS = [
          { idx: 0, start: 1.24 }, // "every"
          { idx: 1, start: 1.56 }, // "order"
          { idx: 2, start: 1.88 }, // "starts"
          { idx: 3, start: 2.28 }  // "cold."
        ];
        WORDS.forEach(function (w) {
          tl.fromTo(q('[data-ek-word="' + w.idx + '"]'),
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            w.start);
        });

        // ---- Scene 3 (5.2–9.92s): ink underline ticks under the ticket rail in
        // three steps on "read" / "ticket" / "again." (css-marker-patterns: stroke draw-on)
        var STEPS = [
          { id: "04-empty-kitchen-ul1", start: 5.24 }, // "read"
          { id: "04-empty-kitchen-ul2", start: 5.88 }, // "ticket"
          { id: "04-empty-kitchen-ul3", start: 6.36 }  // "again."
        ];
        STEPS.forEach(function (s) {
          var el = byId(s.id);
          var dx = el.x2.baseVal.value - el.x1.baseVal.value;
          var dy = el.y2.baseVal.value - el.y1.baseVal.value;
          var len = Math.sqrt(dx * dx + dy * dy);
          tl.fromTo(el,
            { strokeDasharray: len, strokeDashoffset: len },
            { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
            s.start);
        });

        // hold to the crossfade
        tl.set({}, {}, DURATION);

        window.__timelines[ID] = tl;
      })();
    </script>
