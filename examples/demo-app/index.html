<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus Ring</title>
    <style>
      :root {
        --bg: #101318;
        --card: #181c23;
        --ink: #f3f1ec;
        --muted: #8f8a82;
        --ring: #68d9ff;
        --track: #262b34;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: min(420px, 92vw); text-align: center; }
      h1 { font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
      .ring { position: relative; width: 280px; height: 280px; margin: 28px auto; }
      .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .ring circle { fill: none; stroke-width: 14; }
      .ring .track { stroke: var(--track); }
      .ring .bar { stroke: var(--ring); stroke-linecap: round; transition: stroke-dashoffset 0.3s linear; }
      .time {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums;
      }
      .modes { display: flex; gap: 8px; justify-content: center; }
      .modes button, .controls button {
        border: 0; border-radius: 999px; cursor: pointer; font: inherit;
      }
      .modes button { padding: 8px 14px; background: var(--card); color: var(--muted); }
      .modes button.on { background: var(--ink); color: var(--bg); }
      .controls { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }
      .controls button { padding: 14px 28px; font-size: 17px; font-weight: 600; }
      #start { background: var(--ring); color: var(--bg); }
      #reset { background: var(--card); color: var(--ink); }
      .done { margin-top: 22px; color: var(--muted); font-size: 15px; }
      .done b { color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <h1>Focus Ring</h1>
      <div class="ring">
        <svg viewBox="0 0 160 160" aria-hidden="true">
          <circle class="track" cx="80" cy="80" r="70" />
          <circle class="bar" id="bar" cx="80" cy="80" r="70" />
        </svg>
        <div class="time" id="time">25:00</div>
      </div>
      <div class="modes">
        <button data-min="25" class="on">Focus 25</button>
        <button data-min="5">Break 5</button>
        <button data-min="15">Long break 15</button>
      </div>
      <div class="controls">
        <button id="start">Start</button>
        <button id="reset">Reset</button>
      </div>
      <p class="done">Focus sessions done: <b id="count">0</b></p>
    </main>
    <script>
      const R = 70, C = 2 * Math.PI * R;
      const bar = document.getElementById("bar");
      const timeEl = document.getElementById("time");
      const startBtn = document.getElementById("start");
      const countEl = document.getElementById("count");
      bar.style.strokeDasharray = C;

      let total = 25 * 60, left = total, timer = null;
      let sessions = Number(localStorage.getItem("focus-ring-sessions") || 0);
      countEl.textContent = sessions;

      function draw() {
        const m = String(Math.floor(left / 60)).padStart(2, "0");
        const s = String(left % 60).padStart(2, "0");
        timeEl.textContent = `${m}:${s}`;
        bar.style.strokeDashoffset = C * (1 - left / total);
        document.title = timer ? `${m}:${s} · Focus Ring` : "Focus Ring";
      }

      function stop() {
        clearInterval(timer);
        timer = null;
        startBtn.textContent = "Start";
      }

      function tick() {
        left -= 1;
        if (left <= 0) {
          left = 0;
          stop();
          if (total === 25 * 60) {
            sessions += 1;
            localStorage.setItem("focus-ring-sessions", sessions);
            countEl.textContent = sessions;
          }
        }
        draw();
      }

      startBtn.addEventListener("click", () => {
        if (timer) return stop();
        if (left === 0) left = total;
        timer = setInterval(tick, 1000);
        startBtn.textContent = "Pause";
        draw();
      });

      document.getElementById("reset").addEventListener("click", () => {
        stop();
        left = total;
        draw();
      });

      document.querySelectorAll(".modes button").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".modes button").forEach((b) => b.classList.remove("on"));
          btn.classList.add("on");
          stop();
          total = Number(btn.dataset.min) * 60;
          left = total;
          draw();
        });
      });

      draw();
    </script>
  </body>
</html>
